# -----------------------------------------------------
# Project identification
# -----------------------------------------------------
sonar.projectKey=homeassistantassignment
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# -----------------------------------------------------
# Source and test directories
# (relative to project root)
# -----------------------------------------------------
sonar.sources=homeassistant/components/buienradar
sonar.tests=tests/components/buienradar

# -----------------------------------------------------
# Coverage report generated by pytest
# -----------------------------------------------------
sonar.python.coverage.reportPaths=coverage.xml

# -----------------------------------------------------
# Exclusions
# -----------------------------------------------------
sonar.exclusions=**/tests/**,**/test_*.py,**/conftest.py
sonar.test.exclusions=**/conftest.py
